services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: municipality
      POSTGRES_USER: municipality_app
      POSTGRES_PASSWORD: change_this_local_password
    ports:
      - "5432:5432"
    volumes:
      - municipality_pgdata:/var/lib/postgresql/data
volumes:
  municipality_pgdata:
