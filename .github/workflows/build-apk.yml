
name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Flutter project
        id: project
        shell: bash
        run: |
          if [ -f "pubspec.yaml" ]; then
            PROJECT_DIR="."
          elif [ -f "citizen_app/pubspec.yaml" ]; then
            PROJECT_DIR="citizen_app"
          else
            PROJECT_FILE=$(find . -type f -name pubspec.yaml \
              -not -path "*/.dart_tool/*" \
              -not -path "*/build/*" \
              -not -path "*/.git/*" -print -quit)

            if [ -z "$PROJECT_FILE" ]; then
              echo "ERROR: Flutter pubspec.yaml not found."
              exit 1
            fi

            PROJECT_DIR=$(dirname "$PROJECT_FILE")
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Locate and install NDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Android SDK: $SDK_ROOT"

          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found"
            find "$SDK_ROOT" -maxdepth 5 -type f -name sdkmanager
            exit 1
          fi

          echo "Using: $SDKMANAGER"

          rm -rf "$SDK_ROOT/ndk/28.2.13676358"

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            --install "ndk;28.2.13676358"

      - name: Generate Android project
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: flutter create --platforms=android .

      - name: Install dependencies
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: flutter pub get

      - name: Build release APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: municipality-smart-citizen-apk
          path: ${{ steps.project.outputs.project_dir }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
