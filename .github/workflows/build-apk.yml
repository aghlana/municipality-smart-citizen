
name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Flutter project
        id: project
        shell: bash
        run: |
          if [ -f "pubspec.yaml" ]; then
            PROJECT_DIR="."
          elif [ -f "citizen_app/pubspec.yaml" ]; then
            PROJECT_DIR="citizen_app"
          else
            PROJECT_FILE=$(find . -type f -name pubspec.yaml \
              -not -path "*/.dart_tool/*" \
              -not -path "*/build/*" \
              -not -path "*/.git/*" -print -quit)

            if [ -z "$PROJECT_FILE" ]; then
              echo "ERROR: Flutter pubspec.yaml not found."
              exit 1
            fi

            PROJECT_DIR=$(dirname "$PROJECT_FILE")
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Flutter project: $PROJECT_DIR"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Android SDK
        shell: bash
        run: |
          echo "Android SDK: $ANDROID_HOME"
          ls "$ANDROID_HOME/cmdline-tools"

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "SDK Manager: $SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Accept Android licenses
        shell: bash
        run: |
          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" --licenses || true

      - name: Install Android NDK
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "NDK installation attempt $attempt"

            if "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
              --install "ndk;28.2.13676358"; then
              echo "NDK installed successfully"
              exit 0
            fi

            rm -rf "$ANDROID_HOME/ndk/28.2.13676358"
            sleep 15
          done

          echo "ERROR: NDK installation failed"
          exit 1

      - name: Generate Android project
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: flutter create --platforms=android .

      - name: Install dependencies
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: flutter pub get

      - name: Build release APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: municipality-smart-citizen-apk
          path: ${{ steps.project.outputs.project_dir }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
